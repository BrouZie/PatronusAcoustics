; PlatformIO Project Configuration File
;
; Envs:
;   main            - the real application (src/ minus src/tests/)
;   test-<name>     - on-hardware test sketch src/tests/<name>.cpp
;
; New test sketch = drop src/tests/<name>.cpp + add an [env:test-<name>] block.
; Shared drivers/utilities go in lib/ (auto-linked into every env).
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = main

[env]
platform = teensy
board = teensy41
framework = arduino
; explicit optimization level so benchmark numbers don't depend on the
; platform default
build_flags = -O2

[env:main]
build_src_filter = +<*> -<tests/>

[env:test-ics43434]
build_src_filter = -<*> +<tests/ics43434.cpp>

[env:test-ics52000]
build_src_filter = -<*> +<tests/ics52000.cpp>

[env:test-bench-dsp]
build_src_filter = -<*> +<tests/bench_dsp.cpp>
