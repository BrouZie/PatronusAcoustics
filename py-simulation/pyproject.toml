[project]
name = "patronus-sim"
version = "0.1.0"
description = "Dual-ring microphone array SRP-PHAT beamforming simulation"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "streamlit>=1.40",
    "pytest>=9.0.3",
]

[project.scripts]
patronus = "src.main:main"

[dependency-groups]
dev = [
    "pybind11>=3.0.4",
    "scikit-build-core>=0.12.2",
]
