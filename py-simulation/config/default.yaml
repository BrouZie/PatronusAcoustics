# Default configuration — ICS-52000 dual-ring array with full environmental realism.
# All other configs are thin overrides of this file.
# See docs/usage.md for CLI flags and sweep runner.

array:
  ring1_radius: 0.34
  ring2_radius: 0.17
  n_mics_ring1: 8
  n_mics_ring2: 8
  ring_spacing: 0.20

mic:
  model: ics-52000
  snr_dba: 65
  sensitivity_dbFS: -26.0
  aop_db_spl: 120.0
  # As-built hardware imperfections (ICS-52000 tolerance + PCB assembly).
  imperfections:
    gain_std_db: 0.5
    phase_std_deg: 2.0
    position_std_mm: 1.5
    hpf_corner_std_pct: 10.0   # per-mic LF corner spread → freq-dependent mismatch
    quantization_bits: 24
    failed_mics: []
    seed: 0

signal:
  fs: 48000
  duration: 15.0
  drone_spl_db: 73

drone:
  rpm: 6000
  num_blades: 2
  num_rotors: 4
  distance: 30.0
  bpf_harmonics: 6
  initial_bearing:
    azimuth_deg: 0.0
    elevation_deg: 30.0
  trajectory:
    type: oscillating
    closest_distance: 7.0
    closest_azimuth_deg: 0.0
    closest_elevation_deg: 30.0
    cross_range: 14.0
    period: 12.0

srpphat:
  fft_size: 2048
  hop_length: 512
  max_freq: 4000.0
  mode: "phat"
  frequency_weight: 0.0
  search:
    azimuth_range: [-60.0, 60.0]
    elevation_range: [-60.0, 60.0]
    resolution_deg: 2.0
  detection:
    enabled: true
    method: peak_to_mean
    peak_to_mean_threshold_db: 5.0

environment:
  enabled: true
  ground:
    height_m: 5.0
    tilt_deg: 15.0
    # Physical |R| for grassland at low frequency. Pre-v5 configs used
    # 0.03 to compensate a reflected-path amplitude bug (missing 1/d);
    # with the corrected R/d_image scaling, use realistic values.
    reflection_coefficient: 0.9
    model: constant
    flow_resistivity: 200000.0
  noise:
    wind_speed_ms: 1.5
    wind_direction_deg: 0.0
    traffic_density: "none"
    traffic_direction_deg: 90.0
    bird_activity: 0.10
    ambient_db: 30.0          # rural broadband floor, dB SPL (calibrated path)
    windscreen_il_db: 0       # foam windscreen on each mic (station build) (20.0 previously)
  atmospheric:
    temperature_C: 20.0
    humidity_pct: 50.0
    pressure_kPa: 101.325
  refraction:
    enabled: false
    wind_shear_ms_per_m: 0.1
    temperature_lapse_rate: -0.0065
    roughness_length: 0.03
  turbulence:
    amplitude_scintillation: false
    scintillation_strength: 0.1

# MCU requirement estimation: per-stage compute/RAM/flash/uplink budgets
# (SRP-PHAT, log-mel cost model, transmission) matched against target
# profiles, including whether the part can clock the mic chains in over
# TDM. Enable to add feasibility sections to compare reports and sweeps.
mcu:
  enabled: true
  headroom_pct: 30.0
  targets: [stm32h753]        # built-ins: stm32h753, stm32h747, stm32f446,
                              # esp32s3, imxrt1176, teensy41, teensy41_psram
                              # (see docs/mcu.md; calibrate with
                              # mcu.calibrations once hardware numbers exist)
  logmel:
    enabled: true
    n_mels: 64
    bits_per_bin: 8
    channels: 1               # 1 = mixdown; fft/hop default to srpphat's
  link_overhead_pct: 20.0

output:
  animation_fps: 15
  save_animation: true
  save_3d_animation: true
  save_figures: true
  save_data: true
