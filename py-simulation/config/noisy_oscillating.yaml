# ── Realistic Default: Noisy Oscillating Drone ──────────────────────────
# Baseline configuration for detection/non-detection switching experiments.
#
# DESIGN: Oscillating trajectory (7m CPA → 21m apex) creates natural
# detection switching as SNR varies by ~9 dB over each cycle.
# At closest approach (7m, SNR ~24 dB): strong detection
# At farthest (21m, SNR ~16 dB): marginal / non-detection
#
# Ground reflection (coeff=0.03) adds moderate comb-filter nulling that
# interacts with the drone's BPF harmonics, further suppressing detection
# at unfavorable geometries. Directional noise (wind, birds, ambient)
# adds spatially-correlated interference.
#
# ISO 9613-1 atmospheric absorption is ENABLED for realistic
# high-frequency attenuation at longer ranges. Refraction via
# effective sound speed gradient is also active.
#
# Use as base for sweep experiments:
#   python -m src.sweep config/sweep_ground.yaml
#
# Quick test:
#   python -m src.main -c config/noisy_oscillating.yaml --quick --no-animation

array:
  ring1_radius: 0.34       # meters
  ring2_radius: 0.17       # meters
  n_mics_ring1: 8
  n_mics_ring2: 8
  ring_spacing: 0.20       # meters between rings

signal:
  fs: 48000                # sampling rate (Hz)
  duration: 15.0            # seconds
  drone_spl_db: 73         # drone SPL at 1 m (slightly louder Tarot-class)
  # snr_db: 25             # optional manual override (use mic EIN if omitted)

mic:
  snr_dba: 65              # ICS-52000: 65 dBA (94 dB SPL reference)
  sensitivity_dbFS: -26.0
  aop_db_spl: 120.0

drone:
  rpm: 6000                # rotor RPM
  num_blades: 2            # blades per rotor
  num_rotors: 4            # number of rotors
  distance: 30.0           # reference (overridden by trajectory)
  bpf_harmonics: 6
  initial_bearing:
    azimuth_deg: 0.0       # degrees from boresight
    elevation_deg: 30.0    # matches oscillating CPA elevation
  trajectory:
    type: oscillating
    closest_distance: 7.0      # CPA: 7m → SNR ~24 dB (strong det)
    closest_azimuth_deg: 0.0   # direction of CPA
    closest_elevation_deg: 30.0
    cross_range: 14.0          # extends to ~21m → SNR ~16 dB (marginal)
    period: 12.0               # seconds per full oscillation cycle

srpphat:
  fft_size: 2048
  hop_length: 512
  search:
    azimuth_range: [-60.0, 60.0]
    elevation_range: [-60.0, 60.0]
    resolution_deg: 2.0    # degrees per grid step
  max_freq: 4000.0         # max frequency for SRP (Hz)
  mode: "phat"             # "phat" or "standard"
  frequency_weight: 0.0    # 0=flat, 0.5=sqrt, 1=linear, 2=quadratic
  detection:
    enabled: true
    method: peak_to_mean
    peak_to_mean_threshold_db: 5.0

# ── Environment Simulation ──────────────────────────────────────────────
environment:
  enabled: true
  ground:
    height_m: 5.0            # array mast height above ground (m)
    tilt_deg: 15.0           # boresight tilt from horizontal (degrees)
    reflection_coefficient: 0.03  # moderate ground reflectivity
    model: constant          # impedance model: "constant" or "delany_bazley"
    flow_resistivity: 200000.0  # Pa·s/m² (grass)
  noise:
    wind_speed_ms: 1.5       # wind speed (m/s)
    wind_direction_deg: 0.0  # wind azimuth (0=front, 90=right)
    traffic_density: "none"  # "none", "light", "moderate", "heavy"
    traffic_direction_deg: 90.0  # road azimuth from array
    bird_activity: 0.10      # bird chirp density (0-1)
    ambient_db: 10.0         # ambient/pink noise level (0-30)
  atmospheric:
    temperature_C: 20.0       # degrees Celsius
    humidity_pct: 50.0        # relative humidity (%)
    pressure_kPa: 101.325     # atmospheric pressure (kPa)
  refraction:
    enabled: false
    wind_shear_ms_per_m: 0.1  # wind gradient (m/s per m height)
    temperature_lapse_rate: -0.0065  # °C/m (standard atmosphere)
    roughness_length: 0.03    # surface roughness (m)
  turbulence:
    amplitude_scintillation: false
    scintillation_strength: 0.1

output:
  animation_fps: 15
  save_animation: true
  save_3d_animation: true
  save_figures: true
  save_data: true
