# Sweep: detection range with all realism features
# Base: noisy_oscillating with long-range adaptation
# Goal: Find maximum reliable detection range for the 16-mic dual-ring array
# Vary: source distance (stationary), atmospheric conditions
# Expected: detection rate drops as 1/r² + absorption(f)·d exceeds EIN noise floor
#
# Two sub-sweeps:
#   1. Distance sweep (default humidity) — find the detection cliff
#   2. Humidity sweep (at 150m) — understand seasonal variation
#
# Quick test: uv run python -m src.sweep config/sweep_detection_range.yaml --dry-run
base_config: config/benchmark.yaml
sweep:
  drone.distance: [10, 20, 30, 50, 75, 100, 150, 200, 300, 500]
overrides:
  signal.duration: 5.0
  signal.drone_spl_db: 73
  environment.enabled: true
  environment.ground.height_m: 0
  environment.ground.reflection_coefficient: 0.0
  environment.noise.wind_speed_ms: 0.5
  environment.noise.bird_activity: 0.0
  environment.noise.ambient_db: 0.0
  environment.noise.traffic_density: "none"
  environment.atmospheric.temperature_C: 20.0
  environment.atmospheric.humidity_pct: 50.0
  environment.refraction.enabled: false
  environment.turbulence.amplitude_scintillation: false
output: results/sweep_detection_range.csv
