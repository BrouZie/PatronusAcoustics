# Sweep: atmospheric absorption sensitivity analysis
# Vary: humidity, temperature, distance
# Goal: Understand how weather conditions affect max detection range
base_config: config/benchmark.yaml
sweep:
  environment.atmospheric.humidity_pct: [20, 50, 80]
  drone.distance: [50, 100, 150, 200]
overrides:
  signal.duration: 5.0
  signal.drone_spl_db: 73
  environment.enabled: true
  environment.ground.height_m: 0
  environment.ground.reflection_coefficient: 0.0
  environment.noise.wind_speed_ms: 0.0
  environment.noise.bird_activity: 0.0
  environment.noise.ambient_db: 0.0
  environment.noise.traffic_density: "none"
  environment.atmospheric.temperature_C: 20.0
  environment.refraction.enabled: false
  environment.turbulence.amplitude_scintillation: false
