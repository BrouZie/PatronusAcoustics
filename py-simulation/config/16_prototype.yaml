array:
  ring1_radius: 0.50       # meters
  ring2_radius: 0.30       # meters
  n_mics_ring1: 16
  n_mics_ring2: 16
  ring_spacing: 0.30       # meters between rings

signal:
  fs: 48000                # sampling rate (Hz)
  duration: 10.0           # seconds
  drone_spl_db: 70         # drone SPL at 1 m (EIN-based SNR)
  # snr_db: 25             # optional manual override (use mic EIN if omitted)

mic:
  snr_dba: 65              # ICS-52000: 65 dBA (94 dB SPL reference)
  sensitivity_dbFS: -26.0
  aop_db_spl: 120.0

drone:
  rpm: 6000                # rotor RPM
  num_blades: 2            # blades per rotor
  num_rotors: 4            # number of rotors
  distance: 80.0           # meters from array center (reference = arc radius)
  initial_bearing:
    azimuth_deg: 0.0       # degrees from boresight
    elevation_deg: 30.0    # degrees from boresight (reference for arc plane)
  trajectory:
    type: oscillating
    closest_distance: 7.0      # CPA distance (m) - in FoV
    closest_azimuth_deg: 0.0   # direction of CPA
    closest_elevation_deg: 30.0
    cross_range: 14.0          # extends ±14m on each side of CPA
    period: 12.0               # seconds per full oscillation cycle

srpphat:
  fft_size: 2048
  hop_length: 512
  search:
    azimuth_range: [-60.0, 60.0]
    elevation_range: [-60.0, 60.0]
    resolution_deg: 2.0    # degrees per grid step
  max_freq: 4000.0         # max frequency for SRP (Hz)
  mode: "phat"             # "phat" or "standard"
  frequency_weight: 0.0    # 0=flat, 0.5=sqrt, 1=linear, 2=quadratic
  detection:
    enabled: true
    method: peak_to_mean
    peak_to_mean_threshold_db: 5.0

# ── Environment Simulation ──────────────────────────────────────────────
# Guidelines:
#   coeff ≤ 0.05  → usable with 5 dB threshold
#   coeff = 0.10  → severe cancellation, detection collapses
#   tilt  = 0     → boresight level (horizontal)
#   tilt  = 15-30 → tilted upward, changes multipath geometry
#   wind_direction_deg → 0=front, 90=right, -90=left
#   wind_speed_ms → 0.5=still  1=breeze  2=moderate  3=strong
#   traffic_direction_deg → azimuth of road from array
#   traffic       → "none" / "light" / "moderate" / "heavy"
#   bird_activity → 0-1 (0.05=occasional, 0.3=many birds)
#   ambient_db    → 0-30 (5=quiet, 15=noticeable, 25=loud)
environment:
  enabled: true
  ground:
    height_m: 5.0            # array mast height above ground (m)
    tilt_deg: 15.0           # boresight tilt from horizontal (degrees)
    reflection_coefficient: 0.05  # ground reflectivity (0-1)
  noise:
    wind_speed_ms: 1.5       # wind speed (m/s)
    wind_direction_deg: 0.0  # wind azimuth (0=front, 90=right)
    traffic_density: "light"  # "none", "light", "moderate", "heavy"
    traffic_direction_deg: 90.0  # road azimuth from array
    bird_activity: 0.05      # bird chirp density (0-1)
    ambient_db: 10.0         # ambient/pink noise level (0-30)

output:
  animation_fps: 15
  save_animation: false
  save_3d_animation: false
  save_figures: false
  save_data: true
