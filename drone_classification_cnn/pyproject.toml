[project]
name = "drone_classification_cnn"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
	{ name = "KasNgB", email = "kasper@skobba.no" },
    { name = "BrouZie", email = "sokrates.kjoelner@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "librosa>=0.10.0",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyarrow>=26.0.0",
    "pyserial>=3.5",
    "pyyaml>=6.0",
    "scikit-learn>=1.3.0",
    "seaborn>=0.12.0",
    "soundfile>=0.12.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "torchvision>=0.15.0",
    "tqdm>=4.65.0",
    # Dependency of the ROCm torch build; listed so uv fetches it from the ROCm index
    "triton-rocm; sys_platform == 'linux'",
]

[tool.uv]
package = false

# AMD GPU (ROCm) builds of PyTorch on Linux; PyPI's Linux wheels are CUDA-only
[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-rocm", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-rocm", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-rocm", marker = "sys_platform == 'linux'" }]
triton-rocm = [{ index = "pytorch-rocm", marker = "sys_platform == 'linux'" }]
